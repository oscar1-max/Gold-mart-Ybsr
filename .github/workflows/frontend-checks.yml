name: Frontend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # A committed lockfile is not yet present in this repository.
      - run: npm install --no-audit --no-fund
      - run: npm run build
